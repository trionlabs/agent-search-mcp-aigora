name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Pushes and PRs by the owner, members and collaborators run on Blacksmith; any other PR (a fork, a bot) defaults
    # to a GitHub-hosted runner. A PR can edit this file, so this is a default, not a guard: the guard is the
    # repository's fork-PR approval for all external contributors, so review .github/ changes before approving a run.
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The tarball packed here, as release.yml packs it, must equal the committed release evidence.
      - run: npm run verify:release
